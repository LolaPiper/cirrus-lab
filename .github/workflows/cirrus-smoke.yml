
name: CIRRUS smoke tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run harmless experiment
        run: python cirrus_probe.py

      - name: Preserve the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cirrus-evidence-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
